map $http_cookie $tina_site_backend {
    default http://127.0.0.1:4335;
    "~*(^|;\s*)__tina_edit=1(;|$)" http://127.0.0.1:4334;
}

map $http_cookie $tina_site_mode {
    default "production";
    "~*(^|;\s*)__tina_edit=1(;|$)" "editor-preview";
}

server {
    server_name cms.matthiasramahi.de;

    client_max_body_size 512M;

    proxy_hide_header X-Powered-By;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    auth_basic "Tina CMS";
    auth_basic_user_file /etc/nginx/.htpasswd-tina-cms;

    location ^~ /graphql {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /searchIndex {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
    }

    location ^~ /v2/searchIndex {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
    }

    location = /media {
        return 308 /media/;
    }

    location ^~ /media/ {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
    }

    location = /uploads {
        auth_basic off;
        return 301 /uploads/;
    }

    location ^~ /uploads/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:4335;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_hide_header Cache-Control;
        add_header Access-Control-Allow-Origin "https://matthiasramahi.de" always;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
    }

    location = /admin {
        return 302 /admin/;
    }

    location ^~ /admin/ {
        root /var/www/matthias-ramahi-tina;
        try_files $uri $uri/ /admin/index.html;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; connect-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-store, private" always;
        add_header Pragma "no-cache" always;
        add_header Set-Cookie "__tina_edit=1; Path=/; SameSite=Strict; Max-Age=3600" always;
    }

    location / {
        proxy_pass $tina_site_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Tina-Site-Mode $tina_site_mode always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cms.matthiasramahi.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cms.matthiasramahi.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = cms.matthiasramahi.de) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name cms.matthiasramahi.de;
    listen 80;
    return 404; # managed by Certbot
}
